<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tidy</title>
<meta name="description" content="페이지를 만들고 블록으로 정리하는 메모장">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2337352f'/%3E%3Cpath d='M10 9h12M10 16h12M10 23h7' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css?v=20">
<script>try { const t = localStorage.getItem('note.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="side-top">
      <span class="ws">Tidy</span>
      <span class="side-btns">
        <button id="searchBtn" class="icon-btn" aria-label="페이지 검색" title="페이지 검색 (⌘K)"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="8.8" cy="8.8" r="5.3" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M12.8 12.8l3.7 3.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        <button id="closeSide" class="icon-btn" aria-label="사이드바 접기" title="사이드바 접기 (⌘\)"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="12" rx="2.2"/><path d="M8 4v12"/></svg></button>
      </span>
    </div>
    <div id="account" hidden></div>
    <nav class="side-nav">
      <button id="newPage" class="side-act"><span class="si"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16h3.2L15.5 7.7a1.6 1.6 0 0 0 0-2.3l-.9-.9a1.6 1.6 0 0 0-2.3 0L4 12.8V16z"/></svg></span>새 페이지</button>
      <a class="side-act all-link" href="#/all"><span class="si"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="5.5" height="5.5" rx="1.2"/><rect x="11" y="3.5" width="5.5" height="5.5" rx="1.2"/><rect x="3.5" y="11" width="5.5" height="5.5" rx="1.2"/><rect x="11" y="11" width="5.5" height="5.5" rx="1.2"/></svg></span>전체 페이지</a>
    </nav>
    <input id="search" type="search" placeholder="페이지 검색" autocomplete="off" hidden>
    <p class="side-label">페이지</p>
    <div id="tree" role="tree"></div>
    <div class="side-foot">
      <button id="settingsBtn" class="side-act"><span class="si"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></span>설정</button>
      <div hidden>
        <button id="exportBtn"></button>
        <input type="file" id="importFile" accept="application/json,.json">
        <button id="themeBtn"></button>
      </div>
    </div>
  </aside>
  <div id="scrim"></div>
  <main>
    <header class="bar">
      <button id="menuBtn" class="icon-btn" aria-label="사이드바 열기" title="사이드바 열기 (⌘\)"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="12" rx="2.2"/><path d="M8 4v12"/></svg></button>
      <button id="insertBtn" class="icon-btn ins" aria-label="블록 넣기" title="블록 넣기"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg></button>
      <nav id="crumbs"></nav>
      <span id="saved"></span>
      <button id="shareBtn" class="share-btn" aria-label="공유 및 내보내기"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12.5V3.5M6.8 6.5L10 3.3l3.2 3.2"/><path d="M5.5 9.5H4.5v7h11v-7h-1"/></svg><span>공유</span></button>
      <button id="moreBtn" class="icon-btn" aria-label="페이지 메뉴"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="10" r=".9" fill="currentColor"/><circle cx="10" cy="10" r=".9" fill="currentColor"/><circle cx="15" cy="10" r=".9" fill="currentColor"/></svg></button>
    </header>
    <article class="doc">
      <div class="doc-head">
        <button id="icon" aria-label="아이콘 바꾸기"></button>
        <h1 id="title" contenteditable="true" spellcheck="false" data-ph="제목 없음"></h1>
      </div>
      <div id="blocks"></div>
      <div id="pad" aria-hidden="true"></div>
    </article>
    <section id="all" class="doc" hidden>
      <h1 class="all-title">전체 페이지 <span id="allCount"></span></h1>
      <p class="all-sub">모든 페이지를 한눈에 볼 수 있어요.</p>
      <div class="all-tools">
        <input id="allSearch" type="search" placeholder="제목이나 내용으로 찾기" autocomplete="off">
        <select id="allSort" aria-label="정렬">
          <option value="updated">최근 수정순</option>
          <option value="title">이름순</option>
        </select>
      </div>
      <div id="allList"></div>
    </section>
  </main>
</div>
<div id="slash" class="pop" hidden></div>
<div id="pop" class="pop" hidden></div>
<script src="app.js?v=22"></script>
<script type="module" src="cloud.js?v=5"></script>
</body>
</html>
